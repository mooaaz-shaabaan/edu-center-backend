<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع صورة الطالب</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #F8FAFC;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo {
    width: 60px; height: 60px;
    background: #4F46E5;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
  }
  h1 { font-size: 22px; font-weight: 700; color: #0F172A; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #64748B; margin-bottom: 32px; }

  /* Search Input */
  .search-wrap { margin-bottom: 24px; }
  .search-label { font-size: 13px; font-weight: 600; color: #0F172A; margin-bottom: 8px; display: block; text-align: right; }
  .search-row { display: flex; gap: 8px; }
  .search-input {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #E2E8F0;
    border-radius: 10px;
    font-size: 15px;
    text-align: center;
    letter-spacing: 3px;
    outline: none;
    transition: border-color 0.2s;
    font-family: monospace;
  }
  .search-input:focus { border-color: #4F46E5; }
  .search-btn {
    padding: 12px 20px;
    background: #4F46E5;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: #4338CA; }
  .search-btn:disabled { background: #A5B4FC; cursor: not-allowed; }

  /* Photo Area */
  .photo-area {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 3px dashed #CBD5E1;
    margin: 0 auto 24px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #F8FAFC;
    transition: all 0.2s;
  }
  .photo-area:hover { border-color: #4F46E5; background: #EEF2FF; }
  .photo-area.has-photo { border: 3px solid #10B981; }
  .photo-area img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .photo-placeholder { color: #94A3B8; font-size: 13px; }
  .photo-placeholder .icon { font-size: 36px; display: block; margin-bottom: 6px; }
  #photoInput { display: none; }

  /* Buttons */
  .btn {
    width: 100%; padding: 14px;
    border-radius: 12px; border: none;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: #4F46E5; color: white; }
  .btn-primary:hover { background: #4338CA; }
  .btn-primary:disabled { background: #A5B4FC; cursor: not-allowed; }

  /* States */
  .state { display: none; }
  .state.active { display: block; }

  /* Error */
  .error-box {
    background: #FEE2E2; border: 1px solid #FECACA;
    border-radius: 10px; padding: 12px 16px;
    color: #991B1B; font-size: 13px;
    margin-bottom: 16px; display: none;
  }

  /* Success */
  .success-icon { font-size: 64px; margin-bottom: 16px; }
  .success-title { font-size: 20px; font-weight: 700; color: #10B981; margin-bottom: 8px; }
  .success-sub { font-size: 14px; color: #64748B; }

  /* Already Uploaded */
  .already-uploaded {
    background: #FEF3C7; border: 1px solid #FDE68A;
    border-radius: 10px; padding: 16px;
    color: #92400E; font-size: 14px;
    margin-bottom: 16px;
  }

  .student-name { font-size: 18px; font-weight: 700; color: #0F172A; margin-bottom: 4px; }
  .student-code { font-size: 12px; color: #94A3B8; letter-spacing: 2px; margin-bottom: 24px; }

  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block; margin-left: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-btn {
    background: none; border: none;
    color: #64748B; font-size: 13px;
    cursor: pointer; margin-top: 16px;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>Edu Center</h1>

  <!-- Search State -->
  <div id="stateSearch" class="state active">
    <p class="subtitle">أدخل كود الطالب لرفع الصورة</p>
    <div class="search-wrap">
      <label class="search-label">كود الطالب</label>
      <div class="search-row">
        <input type="text" id="codeInput" class="search-input"
          placeholder="000000" maxlength="6"
          onkeydown="if(event.key==='Enter') searchStudent()">
        <button class="search-btn" onclick="searchStudent()" id="searchBtn">بحث</button>
      </div>
    </div>
    <div class="error-box" id="searchError"></div>
  </div>

  <!-- Already Uploaded State -->
  <div id="stateAlreadyUploaded" class="state">
    <p class="subtitle">رفع صورة الطالب</p>
    <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto 16px;border:3px solid #10B981;">
      <img id="existingPhotoImg" src="" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div class="student-name" id="studentNameUploaded"></div>
    <div class="student-code" id="studentCodeUploaded"></div>
    <div class="already-uploaded">✅ تم رفع صورتك بنجاح من قبل — مش مسموح بالتغيير</div>
    <button class="back-btn" onclick="resetToSearch()">← بحث عن طالب آخر</button>
  </div>

  <!-- Upload State -->
  <div id="stateUpload" class="state">
    <p class="subtitle">رفع صورة الطالب</p>
    <div class="student-name" id="studentName"></div>
    <div class="student-code" id="studentCode"></div>

    <div class="photo-area" id="photoArea" onclick="document.getElementById('photoInput').click()">
      <div class="photo-placeholder">
        <span class="icon">📷</span>
        اضغط لاختيار صورة
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)">

    <div class="error-box" id="uploadError"></div>

    <button class="btn btn-primary" id="uploadBtn" onclick="uploadPhoto()" disabled>رفع الصورة</button>
    <p style="font-size:12px;color:#94A3B8;margin-top:12px;">الصورة بترفع مرة واحدة بس ومش ممكن تتغير</p>
    <button class="back-btn" onclick="resetToSearch()">← بحث عن طالب آخر</button>
  </div>

  <!-- Success State -->
  <div id="stateSuccess" class="state">
    <div class="success-icon">✅</div>
    <div class="success-title">تم رفع الصورة بنجاح!</div>
    <div class="success-sub">شكراً — صورتك اتسجلت في النظام</div>
    <button class="back-btn" onclick="resetToSearch()">← رفع صورة طالب آخر</button>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/api';
  let studentCode = '';
  let photoBase64 = '';

  function showState(id) {
    document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showSearchError(msg) {
    const box = document.getElementById('searchError');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function hideSearchError() {
    document.getElementById('searchError').style.display = 'none';
  }

  function showUploadError(msg) {
    const box = document.getElementById('uploadError');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function resetToSearch() {
    studentCode = '';
    photoBase64 = '';
    document.getElementById('codeInput').value = '';
    document.getElementById('photoArea').innerHTML = `
      <div class="photo-placeholder">
        <span class="icon">📷</span>
        اضغط لاختيار صورة
      </div>`;
    document.getElementById('photoArea').classList.remove('has-photo');
    document.getElementById('uploadBtn').disabled = true;
    hideSearchError();
    showState('stateSearch');
  }

  async function searchStudent() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) { showSearchError('يرجى إدخال الكود'); return; }

    hideSearchError();
    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const res = await fetch(`${API}/portal/${code}`);
      const data = await res.json();

      btn.disabled = false;
      btn.textContent = 'بحث';

      if (!data.success) { showSearchError('الكود غير صحيح — تأكد وحاول مرة تانية'); return; }

      const student = data.data;
      studentCode = code;

      if (student.photo) {
        document.getElementById('studentNameUploaded').textContent = student.name;
        document.getElementById('studentCodeUploaded').textContent = student.portal_code;
        document.getElementById('existingPhotoImg').src = student.photo;
        showState('stateAlreadyUploaded');
        return;
      }

      document.getElementById('studentName').textContent = student.name;
      document.getElementById('studentCode').textContent = student.portal_code;
      showState('stateUpload');

    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'بحث';
      showSearchError('حصل خطأ — تأكد من الاتصال بالإنترنت');
    }
  }

  function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
      showUploadError('الصورة أكبر من 2MB — اختار صورة أصغر');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      photoBase64 = e.target.result;
      const area = document.getElementById('photoArea');
      area.innerHTML = `<img src="${photoBase64}" alt="صورة الطالب">`;
      area.classList.add('has-photo');
      document.getElementById('uploadBtn').disabled = false;
      document.getElementById('uploadError').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  async function uploadPhoto() {
    if (!photoBase64) return;
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    btn.innerHTML = 'جاري الرفع... <span class="spinner"></span>';

    try {
      const res = await fetch(`${API}/portal/${studentCode}/photo`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ photo: photoBase64 }),
      });
      const data = await res.json();

      if (data.success) {
        showState('stateSuccess');
      } else {
        showUploadError(data.message || 'فشل رفع الصورة');
        btn.disabled = false;
        btn.innerHTML = 'رفع الصورة';
      }
    } catch (e) {
      showUploadError('حصل خطأ — تأكد من الاتصال بالإنترنت');
      btn.disabled = false;
      btn.innerHTML = 'رفع الصورة';
    }
  }

  // لو في كود في الـ URL استخدمه تلقائي
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode) {
    document.getElementById('codeInput').value = urlCode;
    searchStudent();
  }
</script>
</body>
</html>
