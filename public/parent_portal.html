<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بورتال الأهل — Edu Center</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #4F46E5;
    --primary-light: #EEF2FF;
    --success: #10B981;
    --success-light: #D1FAE5;
    --warning: #F59E0B;
    --warning-light: #FEF3C7;
    --danger: #EF4444;
    --danger-light: #FEE2E2;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --text: #0F172A;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--primary), #7C3AED);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 12px rgba(79,70,229,0.3);
  }
  .header-logo {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header h1 { font-size: 18px; font-weight: 700; color: white; }
  .header p { font-size: 12px; color: rgba(255,255,255,0.7); }

  .container { max-width: 600px; margin: 0 auto; padding: 24px 16px; }

  /* ── Search Card ── */
  .search-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }
  .search-icon { font-size: 48px; margin-bottom: 16px; }
  .search-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .search-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }

  .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
  .code-input {
    flex: 1; padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px; font-size: 18px;
    text-align: center; letter-spacing: 4px;
    outline: none; font-family: monospace;
    transition: border-color 0.2s;
  }
  .code-input:focus { border-color: var(--primary); }
  .search-btn {
    padding: 14px 20px;
    background: var(--primary); color: white;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: background 0.2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: #4338CA; }
  .search-btn:disabled { background: #A5B4FC; cursor: not-allowed; }

  .error-msg {
    background: var(--danger-light); color: #991B1B;
    border-radius: 8px; padding: 10px 14px;
    font-size: 13px; margin-top: 8px; display: none;
  }

  /* ── Student Card ── */
  .student-card {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .student-header {
    background: linear-gradient(135deg, var(--primary), #7C3AED);
    padding: 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .student-photo {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    object-fit: cover;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: white;
    flex-shrink: 0; overflow: hidden;
  }
  .student-photo img { width: 100%; height: 100%; object-fit: cover; }
  .student-info h2 { font-size: 20px; font-weight: 700; color: white; }
  .student-info p { font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 4px; }
  .student-code {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    color: white; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-top: 6px;
    letter-spacing: 2px;
  }

  /* ── Stats Row ── */
  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1px; background: var(--border);
  }
  .stat-item {
    background: var(--surface);
    padding: 16px; text-align: center;
  }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ── Section ── */
  .section {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .section-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
  }
  .section-header h3 { font-size: 14px; font-weight: 700; }
  .section-icon { font-size: 16px; }

  /* ── Course Item ── */
  .course-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .course-item:last-child { border-bottom: none; }
  .course-dot {
    width: 36px; height: 36px;
    background: var(--primary-light);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .course-name { font-size: 14px; font-weight: 500; }

  /* ── Attendance Record ── */
  .attendance-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .attendance-item:last-child { border-bottom: none; }
  .attendance-date { font-size: 13px; color: var(--text-secondary); }

  .badge {
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
  }
  .badge-present { background: var(--success-light); color: #065F46; }
  .badge-absent { background: var(--danger-light); color: #991B1B; }
  .badge-late { background: var(--warning-light); color: #92400E; }

  /* ── Attendance Bar ── */
  .attendance-bar-wrap { padding: 16px; }
  .attendance-bar-header {
    display: flex; justify-content: space-between;
    margin-bottom: 8px; font-size: 13px;
  }
  .attendance-bar-label { color: var(--text-secondary); }
  .attendance-bar-pct { font-weight: 700; color: var(--success); }
  .attendance-bar {
    height: 8px; background: var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .attendance-bar-fill {
    height: 100%; background: var(--success);
    border-radius: 4px; transition: width 0.6s ease;
  }

  /* ── Exam Item ── */
  .exam-item {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .exam-item:last-child { border-bottom: none; }
  .exam-date-box {
    min-width: 48px; height: 48px;
    background: var(--warning-light);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .exam-day { font-size: 18px; font-weight: 800; color: var(--warning); line-height: 1; }
  .exam-month { font-size: 10px; color: var(--warning); }
  .exam-title { font-size: 14px; font-weight: 500; }
  .exam-course { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── Empty ── */
  .empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }

  /* ── Back Button ── */
  .back-btn {
    background: none; border: none;
    color: var(--text-secondary); font-size: 13px;
    cursor: pointer; margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px;
    padding: 0;
  }
  .back-btn:hover { color: var(--primary); }

  /* ── States ── */
  .state { display: none; }
  .state.active { display: block; }

  /* ── Loading ── */
  .loading {
    text-align: center; padding: 40px;
    color: var(--text-muted); font-size: 14px;
  }
  .spinner-lg {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-logo">🎓</div>
  <div>
    <h1>Edu Center</h1>
    <p>بورتال الأهل</p>
  </div>
</div>

<div class="container">

  <!-- Search State -->
  <div id="stateSearch" class="state active">
    <div class="search-card">
      <div class="search-icon">👨‍👩‍👧</div>
      <h2>بورتال ولي الأمر</h2>
      <p>أدخل كود الطالب المرسل مع رسالة الترحيب لمتابعة بياناته</p>
      <div class="input-group">
        <input type="text" id="codeInput" class="code-input"
          placeholder="000000" maxlength="6"
          onkeydown="if(event.key==='Enter') searchStudent()">
        <button class="search-btn" onclick="searchStudent()" id="searchBtn">عرض</button>
      </div>
      <div class="error-msg" id="searchError"></div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="stateLoading" class="state">
    <div class="loading">
      <div class="spinner-lg"></div>
      جاري تحميل البيانات...
    </div>
  </div>

  <!-- Student State -->
  <div id="stateStudent" class="state">
    <button class="back-btn" onclick="resetSearch()">← بحث عن طالب آخر</button>

    <!-- Student Card -->
    <div class="student-card">
      <div class="student-header">
        <div class="student-photo" id="studentPhoto"></div>
        <div class="student-info">
          <h2 id="studentName"></h2>
          <p id="studentBranch"></p>
          <span class="student-code" id="studentCode"></span>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-value" id="statCourses">0</div>
          <div class="stat-label">كورسات</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPresent">0</div>
          <div class="stat-label">حضور</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPct" style="color:var(--success)">0%</div>
          <div class="stat-label">نسبة الحضور</div>
        </div>
      </div>
    </div>

    <!-- Courses -->
    <div class="section">
      <div class="section-header">
        <span class="section-icon">📚</span>
        <h3>الكورسات المسجلة</h3>
      </div>
      <div id="coursesList"></div>
    </div>

    <!-- Attendance -->
    <div class="section">
      <div class="section-header">
        <span class="section-icon">✅</span>
        <h3>سجل الحضور</h3>
      </div>
      <div class="attendance-bar-wrap">
        <div class="attendance-bar-header">
          <span class="attendance-bar-label">نسبة الحضور الكلية</span>
          <span class="attendance-bar-pct" id="attendancePct">0%</span>
        </div>
        <div class="attendance-bar">
          <div class="attendance-bar-fill" id="attendanceBarFill" style="width:0%"></div>
        </div>
      </div>
      <div id="attendanceList"></div>
    </div>

    <!-- Exams -->
    <div class="section" id="examsSection">
      <div class="section-header">
        <span class="section-icon">📝</span>
        <h3>درجات الامتحانات</h3>
      </div>
      <div id="examsList"></div>
    </div>
  </div>

</div>

<script>
  const API = 'http://localhost:3000/api';

  function showState(id) {
    document.querySelectorAll('.state').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function resetSearch() {
    document.getElementById('codeInput').value = '';
    document.getElementById('searchError').style.display = 'none';
    showState('stateSearch');
  }

  async function searchStudent() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) {
      showError('يرجى إدخال الكود');
      return;
    }

    showState('stateLoading');

    try {
      const res = await fetch(`${API}/portal/${code}`);
      const data = await res.json();

      if (!data.success) {
        showState('stateSearch');
        showError('الكود غير صحيح — تأكد وحاول مرة تانية');
        return;
      }

      renderStudent(data.data, code);
      showState('stateStudent');

    } catch (e) {
      showState('stateSearch');
      showError('حصل خطأ — تأكد من الاتصال');
    }
  }

  function showError(msg) {
    const box = document.getElementById('searchError');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function renderStudent(data, code) {
    const student = data;
    const enrollments = student.enrollments || [];
    const attendance = student.attendance || [];

    // ── Photo ──
    const photoEl = document.getElementById('studentPhoto');
    if (student.photo) {
      photoEl.innerHTML = `<img src="${student.photo}" alt="صورة الطالب">`;
    } else {
      photoEl.textContent = student.name ? student.name[0] : '?';
    }

    // ── Info ──
    document.getElementById('studentName').textContent = student.name || '—';
    document.getElementById('studentCode').textContent = `كود: ${student.portal_code || code}`;

    // ── Stats ──
    const presentCount = attendance.filter(a => a.status === 'present').length;
    const pct = attendance.length > 0 ? Math.round(presentCount / attendance.length * 100) : 0;

    document.getElementById('statCourses').textContent = enrollments.length;
    document.getElementById('statPresent').textContent = presentCount;
    document.getElementById('statPct').textContent = `${pct}%`;
    document.getElementById('attendancePct').textContent = `${pct}%`;
    document.getElementById('attendanceBarFill').style.width = `${pct}%`;

    // ── Courses ──
    const coursesList = document.getElementById('coursesList');
    if (enrollments.length === 0) {
      coursesList.innerHTML = '<div class="empty">لا توجد كورسات مسجلة</div>';
    } else {
      coursesList.innerHTML = enrollments.map(e => `
        <div class="course-item">
          <div class="course-dot">📖</div>
          <div class="course-name">${e.course?.name || '—'}</div>
        </div>
      `).join('');
    }

    // ── Attendance ──
    // const attendanceList = document.getElementById('attendanceList');
    // if (attendance.length === 0) {
    //   attendanceList.innerHTML = '<div class="empty">لا توجد سجلات حضور</div>';
    // } else {
    //   attendanceList.innerHTML = attendance.map(a => {
    //     const date = new Date(a.date);
    //     const dateStr = date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
    //     const statusMap = { present: ['حاضر', 'badge-present'], absent: ['غائب', 'badge-absent'], late: ['متأخر', 'badge-late'] };
    //     const [label, cls] = statusMap[a.status] || ['—', ''];
    //     return `
    //       <div class="attendance-item">
    //         <span class="attendance-date">${dateStr}</span>
    //         <span class="badge ${cls}">${label}</span>
    //       </div>
    //     `;
    //   }).join('');
    // }

    attendanceList.innerHTML = attendance.map(a => {
  const date = new Date(a.date);
  const dateStr = date.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
  const statusMap = { present: ['حاضر', 'badge-present'], absent: ['غائب', 'badge-absent'], late: ['متأخر', 'badge-late'] };
  const [label, cls] = statusMap[a.status] || ['—', ''];
  const courseName = a.course?.name || ''; // ← أضف
  return `
    <div class="attendance-item">
      <div>
        <span class="attendance-date">${dateStr}</span>
        ${courseName ? `<div style="font-size:11px;color:#94A3B8;margin-top:2px;">${courseName}</div>` : ''}
      </div>
      <span class="badge ${cls}">${label}</span>
    </div>
  `;
}).join('');

    // ── Grades ──
    const grades = data.grades || [];
    const examsList = document.getElementById('examsList');
    if (grades.length === 0) {
      examsList.innerHTML = '<div class="empty">لا توجد درجات بعد</div>';
    } else {
      examsList.innerHTML = grades.map(g => {
        const grade = g.grade !== null ? g.grade : '—';
        const maxGrade = g.max_grade || 100;
        const pct = g.grade !== null ? Math.round(g.grade / maxGrade * 100) : 0;
        const color = pct >= 75 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--danger)';
        const examDate = g.exam?.exam_date ? new Date(g.exam.exam_date).toLocaleDateString('ar-EG', {day:'numeric', month:'long'}) : '—';
        return `
          <div class="exam-item">
            <div class="exam-date-box" style="background:${color}20">
              <div class="exam-day" style="color:${color}">${grade}</div>
              <div class="exam-month" style="color:${color}">/ ${maxGrade}</div>
            </div>
            <div>
              <div class="exam-title">${g.exam?.title || '—'}</div>
              <div class="exam-course">${examDate}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  // لو في كود في الـ URL
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode) {
    document.getElementById('codeInput').value = urlCode;
    searchStudent();
  }
</script>
</body>
</html>
