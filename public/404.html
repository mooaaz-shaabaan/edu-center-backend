<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الصفحة غير موجودة</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Cairo", sans-serif;
        background: #f5f6fa;
        color: #161821;
        padding: 20px;
      }

      .box {
        width: 100%;
        max-width: 520px;
        text-align: center;
        background: #fff;
        padding: 45px 25px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      }

      .code {
        font-size: 80px;
        font-weight: 800;
        color: #4f46e5;
        line-height: 1;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 24px;
      }

      p {
        color: #6b7280;
        margin-bottom: 25px;
      }

      a {
        display: inline-block;
        text-decoration: none;
        background: #4f46e5;
        color: white;
        padding: 13px 24px;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <div class="code">404</div>

      <h1>الصفحة دي مش موجودة</h1>

      <p>ممكن يكون الرابط مكتوب غلط أو الصفحة اتنقلت.</p>

      <a href="/my-data">الرجوع لبياناتى</a>
    </div>
  </body>
</html>
